<!doctype html>
<meta charset="utf-8">
<title>FRSModLoader icon</title>
<!--
  The square mark, 512x512: the three chevrons on their own.

    chrome --headless --disable-gpu --screenshot=icon.png ^
           --window-size=512,512 icon.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: #070a10; }

  .tile {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background:
      radial-gradient(420px 320px at 38% 34%, rgba(45, 127, 240, .38), transparent 66%),
      linear-gradient(155deg, #101a2a 0%, #0a0e18 58%, #06080e 100%);
    filter: drop-shadow(0 10px 40px rgba(45, 127, 240, .45));
  }
</style>

<div class="tile">
  <svg width="86" height="196" viewBox="0 0 74 168" fill="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6fd3ff"/>
        <stop offset="1" stop-color="#2d7ff0"/>
      </linearGradient>
    </defs>
    <polygon points="0,0 40.7,0 74,84 40.7,168 0,168 33.3,84" fill="url(#g)"/>
  </svg>
  <svg width="86" height="196" viewBox="0 0 74 168" fill="none" opacity=".72">
    <polygon points="0,0 40.7,0 74,84 40.7,168 0,168 33.3,84" fill="url(#g)"/>
  </svg>
  <svg width="86" height="196" viewBox="0 0 74 168" fill="none" opacity=".40">
    <polygon points="0,0 40.7,0 74,84 40.7,168 0,168 33.3,84" fill="url(#g)"/>
  </svg>
</div>
