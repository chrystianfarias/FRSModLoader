<!doctype html>
<meta charset="utf-8">
<title>FRSModLoader</title>
<!--
  The single page CEF loads over the game.

  It draws nothing of its own: it reads mods.json (written by FRSModLoader as it
  loads the mods) and mounts one UI fragment per mod, each inside its own shadow
  root - so one mod's CSS never leaks into another's.

  Each mod gets:
    frsmodloader.send(channel, data)   -> reaches the mod's main.js
    frsmodloader.on(channel, callback) <- whatever main.js sends back
    frsmodloader.sound(name)           -> one of the game's menu sounds
    root                              -> the shadow root it draws into
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;   /* the game shows through */
    overflow: hidden;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    color: #fff;
  }
  /* Every mod covers the whole screen; its own CSS decides what is clickable. */
  .sl-mod {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #sl-errors {
    position: fixed;
    left: 12px;
    bottom: 12px;
    max-width: 60ch;
    display: grid;
    gap: 6px;
    pointer-events: none;
  }
  #sl-console {
    position: fixed; left: 14px; bottom: 14px;
    width: 460px; max-width: 46vw;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
    font: 500 12px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  #sl-log { display: flex; flex-direction: column; gap: 2px; }

  .sl-line {
    background: rgba(8, 8, 10, 0.72);
    border-left: 2px solid rgba(255, 255, 255, 0.14);
    padding: 3px 8px;
    border-radius: 3px;
    color: #d8d8dc;
    width: fit-content; max-width: 100%;
    word-break: break-word;
    /* The lines fade on their own: a console that piles up becomes a curtain
       over the game. With the bar open they come back, because then the
       player is reading. */
    transition: opacity 400ms linear;
  }
  .sl-line .sl-mod-tag { color: #6a6a72; margin-right: 6px; }

  #sl-bar {
    display: none; align-items: center; gap: 6px;
    background: rgba(8, 8, 10, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 4px;
    padding: 5px 9px;
    pointer-events: auto;
  }
  #sl-console.open #sl-bar { display: flex; }
  #sl-console.open .sl-line { opacity: 1 !important; }

  .sl-prompt { color: #f5a300; font-weight: 700; }
  #sl-input {
    flex: 1; background: none; border: 0; outline: 0;
    color: #fff; font: 500 12px/1.4 "Segoe UI", system-ui, sans-serif;
  }

  .sl-error {
    background: rgba(140, 20, 20, .92);
    border-left: 3px solid #ff5a5a;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    white-space: pre-wrap;
  }
</style>

<div id="sl-errors"></div>

<!-- The console: a history of what the mods write, and the command bar. It lives
     in the shell, and not in a mod, because it belongs to all of them. -->
<div id="sl-console">
  <div id="sl-log"></div>
  <div id="sl-bar"><span class="sl-prompt">/</span><input id="sl-input" spellcheck="false" autocomplete="off"></div>
</div>

<script>
(function () {
  const errors = document.getElementById('sl-errors');

  function fail(text) {
    console.error('[shell]', text);
    const div = document.createElement('div');
    div.className = 'sl-error';
    div.textContent = text;
    errors.appendChild(div);
  }

  // The API each mod sees: channels are prefixed with the mod id, which is how
  // the native side knows who to deliver to.
  //
  // What a page subscribes to is remembered, so that mounting it again (a
  // reload, a panel sent twice) takes the old copy's listeners away with it:
  // a page that is gone must not keep answering.
  function apiFor(id) {
    const subs = [];
    return {
      modId: id,
      send(channel, data) {
        window.frsmodloader.send(id + ':' + channel, data);
      },
      on(channel, cb) {
        subs.push([id + ':' + channel, cb]);
        return window.frsmodloader.on(id + ':' + channel, cb);
      },
      off(channel, cb) {
        window.frsmodloader.off(id + ':' + channel, cb);
      },
      dispose() {
        subs.forEach(([c, cb]) => window.frsmodloader.off(c, cb));
        subs.length = 0;
      },
      // One of the game's menu sounds, by name (src/game/MenuSound.h):
      // up, down, left, right, valueLeft, valueRight, confirm, open, close,
      // wrong. Played by the loader, so a page needs no main.js for it.
      sound(name) {
        window.frsmodloader.send('sl:sound', name);
      }
    };
  }

  // A mod's HTML arrives as text: styles and markup go into the shadow root,
  // and its <script> tags run with the mod API in scope. innerHTML on its own
  // would execute no script at all.
  // Who is on screen, by id. Mods from mods.json are mounted once at load;
  // native panels (an .asi asking for a UI through the host API) arrive later
  // and can be replaced or taken away, which is what this map is for.
  const mounted = new Map();

  // Whether the game's own textures are there to draw with (http://nfsu2.tex,
  // served by the loader). nfsu2.css keeps its flat fills under the textured
  // pieces until it knows, and this mark - on the page and on every mod's
  // host, since a shadow root cannot see past its host - is how it knows.
  let textures = false;
  fetch('http://nfsu2.tex/U2_MENU_BOX').then((r) => {
    if (!r.ok) return;
    textures = true;
    document.documentElement.dataset.nfsTex = '';
    mounted.forEach((host) => { host.dataset.nfsTex = ''; });
  }).catch(() => {});

  function unmount(id) {
    const host = mounted.get(id);
    if (!host) return;
    if (host.slApi) host.slApi.dispose();
    if (host.parentNode) host.parentNode.removeChild(host);
    mounted.delete(id);
  }

  function mount(mod, html) {
    unmount(mod.id);

    const host = document.createElement('div');
    host.className = 'sl-mod';
    host.dataset.mod = mod.id;
    if (textures) host.dataset.nfsTex = '';
    document.body.appendChild(host);
    mounted.set(mod.id, host);

    const root = host.attachShadow({ mode: 'open' });
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const scripts = [];
    doc.querySelectorAll('script').forEach(s => {
      scripts.push({ src: s.getAttribute('src'), code: s.textContent });
      s.remove();
    });

    doc.head.querySelectorAll('style, link[rel=stylesheet]').forEach(n => {
      root.appendChild(n.cloneNode(true));
    });
    Array.from(doc.body.childNodes).forEach(n => root.appendChild(n));

    const api = apiFor(mod.id);
    host.slApi = api;
    host.dataset.key = mountKey(mod);
    const base = mod.url.slice(0, mod.url.lastIndexOf('/') + 1);

    const run = (code, origin) => {
      try {
        new Function('frsmodloader', 'root', 'mod', code)(api, root, mod);
      } catch (e) {
        fail(mod.id + ' / ' + origin + ': ' + e.message);
      }
    };

    // External scripts keep their order: each waits for the previous one.
    (async () => {
      for (const s of scripts) {
        if (s.src) {
          try {
            const url = new URL(s.src, base).href;
            run(await (await fetch(url)).text(), s.src);
          } catch (e) {
            fail(mod.id + ': could not load ' + s.src + ' (' + e.message + ')');
          }
        } else {
          run(s.code, 'inline');
        }
      }
    })();
  }

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  async function load() {
    // A safety net for the race between the page opening and mods.json
    // existing. The native loading now writes the file before bringing up the
    // UI, but the page also reloads on its own (F5) and can arrive at any
    // moment — trying again costs less than an empty UI.
    let mods;
    for (let attempt = 1; attempt <= 10; attempt++) {
      try {
        mods = await (await fetch('mods.json?t=' + Date.now())).json();
        break;
      } catch (e) {
        if (attempt === 10) {
          fail('mods.json could not be read after 10 tries: ' + e.message);
          return;
        }
        await wait(150);
      }
    }

    for (const mod of mods) {
      try {
        const response = await fetch(mod.url);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        mount(mod, await response.text());
      } catch (e) {
        fail('UI for ' + mod.id + ' failed: ' + e.message);
      }
    }
    console.log('[shell] ' + mods.length + ' UI(s) mounted');

    // Native panels live only in the game's memory, not in mods.json, so the
    // page has to ask for them back every time it loads - including after F5.
    window.frsmodloader.send('sl:panels', null);
  }

  // ------------------------------------------------------- native panels
  //
  // An .asi mod that is not written in JavaScript gets its interface here. It
  // is mounted exactly like a mod's, with the same shadow root and the same
  // "<id>:<channel>" convention, so the page cannot tell the difference.
  //
  // The same panel can be sent twice: the loader mounts it as soon as the page
  // is up, and the page asks for every panel again when it loads (it cannot
  // tell a first load from an F5). Mounting it twice would run its script
  // twice, so a panel already here - or on its way - with the same page and
  // the same generation (panel_reload bumps it) is left alone.
  const mountKey = (p) => p.url + '#' + (p.gen || 0);
  const pending = new Map();   // id -> key being fetched

  async function mountPanel(panel) {
    const key = mountKey(panel);
    const cur = mounted.get(panel.id);
    if ((cur && cur.dataset.key === key) || pending.get(panel.id) === key) return;
    pending.set(panel.id, key);
    try {
      const response = await fetch(panel.url + '?t=' + Date.now());
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const html = await response.text();
      // A newer request for this panel arrived meanwhile: that one mounts.
      if (pending.get(panel.id) !== key) return;
      mount(panel, html);
      console.log('[shell] panel ' + panel.id + ' mounted');
    } catch (e) {
      fail('panel ' + panel.id + ' failed: ' + e.message);
    } finally {
      if (pending.get(panel.id) === key) pending.delete(panel.id);
    }
  }

  window.frsmodloader.on('sl:mount', (panel) => {
    if (panel && panel.id && panel.url) mountPanel(panel);
  });

  window.frsmodloader.on('sl:unmount', (d) => {
    if (d && d.id) unmount(d.id);
  });

  window.frsmodloader.on('sl:panel-show', (d) => {
    const host = d && mounted.get(d.id);
    if (host) host.style.display = d.show ? '' : 'none';
  });

  // ------------------------------------------------------------------ console
  //
  // The color markup is resolved here, and not on the native side: this layer
  // is the one that draws, and sending the line already split into pieces
  // would only add a format to maintain on both sides.
  const COLORS = {
    vermelho: '#ff5a4a', red: '#ff5a4a',
    verde: '#3ddc72', green: '#3ddc72',
    amarelo: '#f2e600', yellow: '#f2e600',
    laranja: '#ef9a10', orange: '#ef9a10',
    azul: '#4aa8ff', blue: '#4aa8ff',
    cinza: '#8a8a93', gray: '#8a8a93', grey: '#8a8a93',
    branco: '#ffffff', white: '#ffffff',
  };

  const consoleEl = document.getElementById('sl-console');
  const logEl = document.getElementById('sl-log');
  const inputEl = document.getElementById('sl-input');

  const MAX_LINES = 8;
  const FADE_AFTER = 7000;

  // "burned {orange}12.4 L{/} of ethanol" -> colored nodes.
  function paint(text) {
    const frag = document.createDocumentFragment();
    const re = /\{(\/|#[0-9a-fA-F]{3,6}|[a-zA-Z]+)\}/g;
    let i = 0, color = null, m;

    const push = (t) => {
      if (!t) return;
      const span = document.createElement('span');
      span.textContent = t;
      if (color) span.style.color = color;
      frag.appendChild(span);
    };

    while ((m = re.exec(text)) !== null) {
      push(text.slice(i, m.index));
      const tag = m[1];
      color = tag === '/' ? null : (tag[0] === '#' ? tag : (COLORS[tag.toLowerCase()] || null));
      i = m.index + m[0].length;
    }
    push(text.slice(i));
    return frag;
  }

  function writeLine(mod, text) {
    const div = document.createElement('div');
    div.className = 'sl-line';

    if (mod && mod !== 'sl') {
      const tag = document.createElement('span');
      tag.className = 'sl-mod-tag';
      tag.textContent = mod;
      div.appendChild(tag);
    }
    div.appendChild(paint(String(text)));
    logEl.appendChild(div);

    while (logEl.children.length > MAX_LINES) logEl.removeChild(logEl.firstChild);

    setTimeout(() => { div.style.opacity = '0'; }, FADE_AFTER);
    setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, FADE_AFTER + 500);
  }

  window.frsmodloader.on('sl:log', (d) => writeLine(d && d.mod, d && d.text));
  window.frsmodloader.on('sl:command-reply', (t) => writeLine('sl', t));

  // The "/" that opens the bar arrives twice: once as a key, which the native
  // side intercepts to open it, and again as a character, with the keyboard
  // already handed to the UI — and that second one showed up typed in the
  // field. The first slash after opening is dropped.
  let swallowSlash = false;

  window.frsmodloader.on('sl:command-open', () => {
    consoleEl.classList.add('open');
    inputEl.value = '';
    swallowSlash = true;
    setTimeout(() => { swallowSlash = false; }, 250);
    inputEl.focus();
  });

  inputEl.addEventListener('beforeinput', (e) => {
    if (swallowSlash && e.data === '/') { e.preventDefault(); swallowSlash = false; }
  });

  function closeConsole() {
    consoleEl.classList.remove('open');
    inputEl.blur();
    window.frsmodloader.send('sl:command-close', null);
  }

  inputEl.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Escape') { closeConsole(); return; }
    if (e.key !== 'Enter') return;

    const line = inputEl.value.trim();
    inputEl.value = '';
    closeConsole();
    if (line) {
      writeLine('sl', '{gray}/' + line + '{/}');
      window.frsmodloader.send('sl:command', line);
    }
  });

  if (!window.frsmodloader) {
    fail('window.frsmodloader is missing: did FRSModLoaderHelper.exe start?');
  }
  load();
})();
</script>
