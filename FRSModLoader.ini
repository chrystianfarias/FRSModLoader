; FRSModLoader - a modding platform for NFS Underground 2
; Sits next to FRSModLoader.asi, in the game's scripts\ folder.

[UI]
; 0 turns Chromium off entirely: mods keep running, with no HTML layer.
Enabled = 1

; Key that hands keyboard and mouse to the UI (and gives them back).
; 0x70 = F1. Any Windows virtual-key works: 0x71 = F2, 0x2D = Insert...
ToggleKey = 0x70

; Page loaded on top of the game. Empty = FRSModLoader\ui\shell.html, which
; mounts each mod's UI. Point this at http://localhost:5173 to develop the UI
; with hot reload.
Url =

; 1 opens Chromium's DevTools in a separate window at startup. Console,
; network and inspector all work - that is the point of the UI being Chromium.
DevTools = 0

; 1 shows on screen what mods write with console.log, in the same panel as
; speed.print (bottom-left corner, the lines fade on their own). Useful
; while developing a mod; 0 keeps the log in the file only.
Console = 1

; The loader's card on the boot splash (wordmark, mods loaded, version). It is
; drawn by the .asi itself, with or without Chromium. 0 leaves the splash alone.
SplashCard = 1

; The pointer is the game's own (PC_CURSOR), shown when the game shows it and
; drawn above the page; Windows' stays hidden. The mouse needs no F1: clicks on
; something the page drew are the page's, the rest the game's. The cursor is
; sized like the frontend's, to the screen's height.
CursorScale = 1.0

; 1 replaces CEF's content with a checkerboard. Use it to tell a compositing
; problem (D3D9 hook, texture, blending) apart from a page problem.
TestPattern = 0

[Mods]
; Folder holding one subdirectory per mod, each with its own mod.json.
; Relative to the .asi.
Dir = FRSModLoader\mods

[Hooks]
; Where FRSModLoader attaches to the game's main loop. 0x581470 and 0x581475 are
; two consecutive calls to the same empty stub: NFSU2ExtraOptions uses the
; first and Pops uses the second. Change this if you run all three together.
MainLoopSite = 0x581475
